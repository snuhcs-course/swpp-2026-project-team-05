name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Django tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FRAMELESS_USE_SQLITE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt coverage==7.16.2
      - name: Check Django configuration
        run: python manage.py check
      - name: Check the coverage gate
        run: python -m unittest discover -s ci -p 'test_*.py'
      - name: Run tests with coverage
        run: python -m coverage run --branch --source=server manage.py test --verbosity 1
      - name: Report coverage
        if: always()
        run: |
          if test -f .coverage; then
            python -m coverage report -m
            python -m coverage json -o coverage.json
            python -m coverage html -d htmlcov
          fi
      - name: Enforce tested backend coverage goals
        run: python ci/check_coverage.py python coverage.json
      - name: Save backend coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            coverage.json
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android JVM tests and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
      - uses: gradle/actions/setup-gradle@v6
      - name: Run JVM tests, coverage, lint, and build APK
        working-directory: android
        run: ./gradlew :app:jacocoDebugUnitTestReport :app:lintDebug :app:assembleDebug --no-daemon
      - name: Enforce tested Android coverage goals
        run: python3 ci/check_coverage.py android android/app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
      - name: Save Android test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-evidence
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/jacoco/jacocoDebugUnitTestReport/
            android/app/build/reports/lint-results-debug.xml
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Save candidate debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-default-backend-no-live-check
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Explain APK scope
        run: echo 'This APK uses the app default backend URL. CI does not run a live Gemini/NAVER v2 analysis or device walkthrough.' >> "$GITHUB_STEP_SUMMARY"
