name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Django tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt coverage==7.16.2
      - name: Check Django configuration
        run: python manage.py check
      - name: Run tests with coverage
        run: python -m coverage run --branch --source=server manage.py test --verbosity 1
      - name: Report coverage
        run: python -m coverage report -m

  android:
    name: Android JVM tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
      - uses: gradle/actions/setup-gradle@v6
      - name: Run JVM tests, coverage, and build APK
        working-directory: android
        run: ./gradlew :app:jacocoDebugUnitTestReport :app:assembleDebug --no-daemon
