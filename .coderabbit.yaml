# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_progress: true
  # Keep the bot's status reporting separate from the existing Verify CI check.
  commit_status: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Review every eligible push without auto-pausing after a commit limit.
    auto_pause_after_reviewed_commits: 0
