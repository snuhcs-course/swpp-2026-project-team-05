services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: production
      DJANGO_ALLOWED_HOSTS: ${SERVER_DOMAIN:?Set SERVER_DOMAIN in .env}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:?Set SERVER_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
